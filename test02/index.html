        @layer utilities {

            .tarot-border {
                position: relative;
                overflow: hidden;
            }
            .tarot-border::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 5px;
                background: linear-gradient(90deg, #A78BFA, #F59E0B, #FBCFE8, #A78BFA);
                background-size: 300% 100%;
                animation: shimmer 6s linear infinite;
            }
            @keyframes shimmer {
                0% { background-position: 0% 0%; }
                100% { background-position: 300% 0%; }
            }
            .star-dot {
                position: absolute;
                width: 2px;
                height: 2px;
                background: rgba(167, 139, 250, 0.6);
                border-radius: 50%;

            @keyframes twinkle {

                100% { opacity: 1; }
            }
            .fade-in {

            }
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(12px); }
                to { opacity: 1; transform: translateY(0); }
            }
        }

            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;

    <script>

        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // 粒子类 塔罗星芒样式
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 4 + 1;
                this.speedX = Math.random() * 4 - 2;
                this.speedY = Math.random() * -3 - 1;
                this.life = 1;
                this.decay = Math.random() * 0.015 + 0.008;
                // 塔罗紫、浅粉、星光金三色粒子
                const colorList = ['#A78BFA','#FBCFE8','#F59E0B'];
                this.color = colorList[Math.floor(Math.random() * colorList.length)];
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.life -= this.decay;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color + Math.floor(this.life * 255).toString(16).padStart(2,'0');
                ctx.fill();
            }
        }

        // 生成塔罗粒子
        function createTarotParticles(x, y, count = 22) {
            for(let i=0; i<count; i++){
                particles.push(new Particle(x,y));
            }
        }

        // 动画循环
        function animateParticles() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            for(let i = particles.length - 1; i >= 0; i--){
                const p = particles[i];
                p.update();
                p.draw();
                if(p.life <= 0) particles.splice(i,1);
            }
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // 全局点击监听触发粒子
        document.addEventListener('click', (e)=>{
            createTarotParticles(e.clientX, e.clientY, 22);

                    "秘书岗位有风险提示责任，不能以\"不想掺和\"逃避本职；",
                    "不需要强硬争吵，但必须清晰传递立场，给出明确反馈，不要悬置工作；",
                    "遇到难以沟通的场景，可以暂停沟通，但不能彻底搁置，择机再次汇报提示风险。"
                ],
                books: [
                    "《非暴力沟通》",
                    "《被讨厌的勇气》"
                ]
            },
            principle: {
                title: "原则平衡型｜正义牌倾向",
                icon: "fas fa-balance-scale",
                color: "text-purple-600",
                bgColor: "bg-purple-50",
                description: "具备清晰的制度底线，尊重领导但不盲从。面对不合规事项，既不盲目顺从，也不激烈顶撞。能够客观讲清制度与风险，同时主动提供合规替代方案，做到\"守住原则、讲究方式、闭环留痕\"。可以平衡人际关系与岗位合规要求，是秘书岗位理想的处事模式。",
                tips: [
                    "保持现有原则意识，持续熟悉各项规章制度，做到提示风险有理有据；",
                    "持续打磨沟通话术，根据领导性格调整表达方式，减少沟通对立感；",
                    "养成重要事项留痕习惯，保护自身，也帮助领导充分识别决策风险；",
                    "面对压力时，也允许自身产生顾虑情绪，不必苛求做到完全毫无心理负担。"
                ],
                books: [
                    "《秘书工作手记》",
                    "《向上沟通的艺术》"
                ]
            }
        };

        // 全局变量
        let currentQuestionIndex = 0;
        let userAnswers = {};
        let totalScores = { compliant: 0, avoidant: 0, principle: 0 };

        // DOM元素
        const introSection = document.getElementById('intro-section');
        const quizSection = document.getElementById('quiz-section');
        const resultSection = document.getElementById('result-section');
        const startBtn = document.getElementById('start-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const restartBtn = document.getElementById('restart-btn');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const currentQuestionSpan = document.getElementById('current-question');
        const progressBar = document.getElementById('progress-bar');
        const progressPercent = document.getElementById('progress-percent');
        const resultContent = document.getElementById('result-content');

        function initEventListeners() {
            startBtn.addEventListener('click', startQuiz);
            prevBtn.addEventListener('click', showPreviousQuestion);
            nextBtn.addEventListener('click', handleNextQuestion);
            restartBtn.addEventListener('click', restartQuiz);
        }

        function startQuiz() {
            introSection.classList.add('hidden');
            quizSection.classList.remove('hidden');
            currentQuestionIndex = 0;
            userAnswers = {};
            totalScores = { compliant: 0, avoidant: 0, principle: 0 };
            showQuestion();
        }

        function showQuestion() {
            const question = questions[currentQuestionIndex];
            currentQuestionSpan.textContent = currentQuestionIndex + 1;
            questionText.textContent = question.text;
            optionsContainer.innerHTML = '';

            question.options.forEach(option => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'option-card p-4 border-2 border-purple-100 rounded-xl cursor-pointer transition-all duration-300 hover:border-purple-400 hover:bg-purple-50 bg-white/70';
                optionDiv.innerHTML = `
                    <label class="flex items-center cursor-pointer">
                        <input type="radio" name="question-${question.id}" value="${option.id}" class="mr-3 w-4 h-4 text-purple-600">
                        <span class="text-dark">${option.id}. ${option.text}</span>
                    </label>
                `;
                optionsContainer.appendChild(optionDiv);

                optionDiv.addEventListener('click', () => selectOption(question.id, option.id, optionDiv));
            });

            updateProgress();
            updateButtonStates();
        }

        function selectOption(questionId, optionId, optionDiv) {
            const allOptions = optionsContainer.querySelectorAll('.option-card');
            allOptions.forEach(option => {
                option.classList.remove('border-purple-400', 'bg-purple-50');
                option.querySelector('input').checked = false;
            });

            optionDiv.classList.add('border-purple-400', 'bg-purple-50');
            optionDiv.querySelector('input').checked = true;

            userAnswers[questionId] = optionId;
            nextBtn.disabled = false;
        }

        function handleNextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                showQuestion();
            } else {
                calculateResult();
                showResult();
            }
        }

        function showPreviousQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                showQuestion();
            }
        }

        function updateProgress() {
            const progress = ((currentQuestionIndex + 1) / questions.length) * 100;
            progressBar.style.width = `${progress}%`;
            progressPercent.textContent = Math.round(progress);
        }

        function updateButtonStates() {
            prevBtn.classList.toggle('hidden', currentQuestionIndex === 0);
            nextBtn.disabled = !userAnswers[questions[currentQuestionIndex].id];
            nextBtn.innerHTML = currentQuestionIndex === questions.length - 1
                ? '提交测试<i class="fas fa-check ml-2"></i>'
                : '下一题<i class="fas fa-arrow-right ml-2"></i>';
        }

        // ========== 核心得分计算逻辑 ==========
        function calculateResult() {
            // 重置三类得分
            totalScores = { compliant: 0, avoidant: 0, principle: 0 };

            // 遍历所有10道题的答案，累加对应类型的分数
            Object.entries(userAnswers).forEach(([questionId, optionId]) => {
                const question = questions.find(q => q.id === parseInt(questionId));
                const option = question.options.find(o => o.id === optionId);
                totalScores[option.type] += option.score;
            });

            // 找出得分最高的类型，作为最终结果
            const maxScore = Math.max(...Object.values(totalScores));
            return Object.keys(totalScores).find(key => totalScores[key] === maxScore);
        }

        function showResult() {
            quizSection.classList.add('hidden');
            resultSection.classList.remove('hidden');

            const resultType = calculateResult();
            const result = resultConfig[resultType];

            resultContent.innerHTML = `
                <div class="text-center">
                    <div class="w-24 h-24 ${result.bgColor} rounded-full flex items-center justify-center mx-auto mb-6 border border-purple-100">
                        <i class="${result.icon} ${result.color} text-3xl"></i>
                    </div>
                    <h3 class="text-3xl font-bold ${result.color} mb-4">${result.title}</h3>
                    <p class="text-dark/70 leading-relaxed max-w-2xl mx-auto mb-8">${result.description}</p>
                </div>

                <div class="grid md:grid-cols-2 gap-8">
                    <div class="${result.bgColor} rounded-xl p-6 border border-purple-100">
                        <h4 class="font-bold text-xl mb-4 text-dark">
                            <i class="fas fa-crystal-ball ${result.color} mr-2"></i>心态调整提示
                        </h4>
                        <ul class="space-y-3 text-dark/70">
                            ${result.tips.map(tip => `<li class="flex items-start"><i class="fas fa-star ${result.color} mr-2 mt-1"></i>${tip}</li>`).join('')}
                        </ul>
                    </div>

                    <div class="${result.bgColor} rounded-xl p-6 border border-purple-100">
                        <h4 class="font-bold text-xl mb-4 text-dark">
                            <i class="fas fa-book-open ${result.color} mr-2"></i>推荐阅读书籍
                        </h4>
                        <ul class="space-y-3 text-dark/70">
                            ${result.books.map(book => `<li class="flex items-start"><i class="fas fa-feather-alt ${result.color} mr-2 mt-1"></i>${book}</li>`).join('')}
                        </ul>
                    </div>
                </div>

                <div class="text-center p-6 ${result.bgColor} rounded-xl border border-purple-100">
                    <h4 class="font-bold text-lg mb-3 ${result.color}">你的最终得分</h4>
                    <div class="flex justify-center space-x-8 text-center">
                        <div>
                            <div class="text-2xl font-bold ${result.color}">${totalScores.compliant}</div>
                            <div class="text-dark/60 text-sm">讨好顺从型</div>
                        </div>
                        <div>
                            <div class="text-2xl font-bold ${result.color}">${totalScores.avoidant}</div>
                            <div class="text-dark/60 text-sm">冲突回避型</div>
                        </div>
                        <div>
                            <div class="text-2xl font-bold ${result.color}">${totalScores.principle}</div>
                            <div class="text-dark/60 text-sm">原则平衡型</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function restartQuiz() {
            resultSection.classList.add('hidden');
            introSection.classList.remove('hidden');
        }

        document.addEventListener('DOMContentLoaded', initEventListeners);
    </script>
</body>
</html>
